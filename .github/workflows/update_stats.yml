name: Update GitHub Metrics
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # 統計カードの生成
      - name: Generate Stats Card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          # カスタムカラー：背景(0d1117), タイトル(ff79c6), 数値(bd93f9), アイコン(ff79c6)
          options: username=sotashimozono&show_icons=true&bg_color=0d1117&title_color=ff79c6&text_color=bd93f9&icon_color=ff79c6&border_color=ff79c6
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          # 取得失敗時にエラーカードを書かず、ジョブを赤くする
          fail_on_error: true

      # 言語カードの生成（Jupyter Notebookを除外）
      - name: Generate Language Card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          # hide で Jupyter Notebook を除外（※ hide_langs ではない）
          options: username=sotashimozono&layout=compact&bg_color=0d1117&title_color=ff79c6&text_color=bd93f9&hide=jupyter%20notebook&border_color=ff79c6
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      # 外部プロジェクトへの貢献カード。上の 2 枚と同じ配色で自前で描く
      - name: Generate Contributions Card
        env:
          # 公開情報だけを読む。標準のトークンは非公開リポジトリを含む問い合わせで失敗するため PAT を使う
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: python3 .github/scripts/contributions_card.py

      # 画像をリポジトリにコミット
      - name: Commit changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update GitHub stats images" || exit 0
          git push
