name: Update GitHub Metrics
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # Stats card
      - name: Generate Stats Card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          # Colours: background 0d1117, title ff79c6, values bd93f9, icons ff79c6
          options: username=sotashimozono&show_icons=true&bg_color=0d1117&title_color=ff79c6&text_color=bd93f9&icon_color=ff79c6&border_color=ff79c6
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          # Fail the job on a fetch error instead of writing an error card
          fail_on_error: true

      # Languages card, without Jupyter Notebook
      - name: Generate Language Card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          # The option that drops a language is `hide`, not `hide_langs`
          options: username=sotashimozono&layout=compact&bg_color=0d1117&title_color=ff79c6&text_color=bd93f9&hide=jupyter%20notebook&border_color=ff79c6
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      # Contributions to other projects, drawn in the same colours as the two cards above
      - name: Generate Contributions Card
        env:
          # Reads public data only. The workflow token fails on this query because it also touches private repositories
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: python3 .github/scripts/contributions_card.py

      # Commit the images
      - name: Commit changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update GitHub stats images" || exit 0
          git push
